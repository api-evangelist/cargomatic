openapi: 3.2.0
info:
  title: Cargomatic Public Shipper API
  description: '!Cargomatic


    ## Welcome to the Cargomatic API!

    Our quoting, booking, and status APIs allow you to automate common workflows similar to features available within the Cargomatic portal.


    Please reach out to apisupport@cargomatic.com for sandbox credentials to get started.'
  version: 3.0.0
servers:
- url: https://api-acceptance.cargomatic.com
tags:
- name: Shipper
  description: Endpoints for Cargomatic Shippers
paths:
  /quotes:
    post:
      operationId: createQuote
      summary: Creates a quote
      description: 'Creates a quote based on the factors provided in the request body.

        This API endpoint is only accessible by Shippers and Admins!'
      tags:
      - Shipper
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: 'Status Code 500: Internal Server Error Response - there''s a problem with the Public API service'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /orders:
    post:
      operationId: createOrder
      summary: Creates an order
      description: Creates an order based on the factors provided in the request body. This API endpoint can only be accessed by Shippers!
      tags:
      - Shipper
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: 'Status Code 500: Internal Server Error Response - there''s a problem with the Public API service'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /shipments:
    post:
      operationId: createShipment
      summary: Create a shipment/offer
      description: 'Creates a shipment based on the factors provided in the request body. This API endpoint can only be accessed by Admins and Shippers!

        `action` - add, update, cancel'
      tags:
      - Shipper
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: 'Status Code 500: Internal Server Error Response - there''s a problem with the Public API service'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
    get:
      operationId: listShipments
      summary: Lists all shipments with a pagination option
      description: Returns a paginated list of shipments visible to the authenticated account. Use the `page` and `per_page` query parameters to page through results.
      tags:
      - Shipper
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        description: Page number, indicates the page of results that you want returned. Default value is 1.
        required: false
        schema:
          type: number
      - name: per_page
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: number
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: 'Status Code 500: Internal Server Error Response - there''s a problem with the Public API service'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /shipments/status:
    get:
      operationId: shipmentStatus
      summary: Returns a shipment with status info
      description: Returns the shipment identified by the `shipmentReference` query parameter, including its current status and the status of each of its stops.
      tags:
      - Shipper
      security:
      - bearerAuth: []
      parameters:
      - name: shipmentReference
        in: query
        description: Shipment Id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: 'Status Code 500: Internal Server Error Response - there''s a problem with the Public API service'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /webhooks/loads:
    post:
      operationId: processLoads
      summary: Process loads
      description: Webhook endpoint that accepts an inbound load payload for processing. Returns `204 No Content` once the load has been accepted.
      tags:
      - Shipper
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '204':
          description: 'Status Code 204: No Content - the request was accepted and there is no response body'
  /stops/complete:
    post:
      operationId: completeStop
      summary: Mark a stop as complete
      description: Marks a stop as "complete". The `stopId`, and `shipmentReference` is required for all shipment types. If the shipment is shorthaul, only admins can access this route and file data must also be provided. If the shipment is drayage, `chassis`, `trailerId`, and `containerId` may be required.
      tags:
      - Shipper
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteStopRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteStopResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: 'Status Code 500: Internal Server Error Response - there''s a problem with the Public API service'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /stops/transition:
    post:
      operationId: arriveAtStop
      summary: Mark a stop as "arrived"
      description: 'Marks a stop as "arrived". `status`, `stopId`, and `shipmentReference` are required. The only acceptable value for `status` is `arrived` (see example request body). If `date` is not provided, the current time will be used as the arrival time.

        Admins, shippers, carriers, and drivers are authorized to use this API endpoint.'
      tags:
      - Shipper
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArriveAtStopRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArriveAtStopResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: 'Status Code 500: Internal Server Error Response - there''s a problem with the Public API service'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  /stops/add:
    post:
      operationId: addStop
      summary: Add additional stops to a shipment
      description: '`shipmentReference` and at least one new stop are required. Each new stop must include `address`, `action`, `name`, `sequence`, `windowStart`, `windowEnd`, and other fields dependent on the type of shipment.

        For US-based clients, the address must include street address, city, state, and zipcode. The `action` is either "pickup" or "delivery". The sequence number is sequence of the stop within the shipment. The `name` of the stop is the location name. `windowStart` is when the pickup/delivery window starts for that stop. `windowEnd` is when the pickup/delivery window ends for that stop.

        If the shipment is shorthaul, the new stop must include load data and it must be indicated whether the cargo is a full truckload or not. If the shipment is drayage, the new stop must indicate whether the container is empty or not and location must be included.'
      tags:
      - Shipper
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStopRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddStopResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: 'Status Code 500: Internal Server Error Response - there''s a problem with the Public API service'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
components:
  schemas:
    OrderResponse:
      type: object
      properties:
        order:
          type: object
          description: The order that was created.
          properties:
            order_id:
              type: string
              example: ORD-8246
              description: Cargomatic-assigned identifier for the order.
            order_type:
              type: string
              example: import
              description: Type of the order, e.g. `import`, `export`, `domestic`, or `reposition`.
            reference_numbers:
              type: array
              description: Reference numbers associated with the order.
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: delivery_order
                    description: Identifier for the reference number.
                  value:
                    type: string
                    example: LGB0123456789
                    description: Value of the reference number.
            service_type:
              type: string
              enum:
              - live
              - drop
              example: live
              description: How the freight is handled. One of `live` or `drop`.
            movement_type:
              type: string
              enum:
              - pickup
              - delivery
              example: delivery
              description: Movement type of the order. One of `pickup` or `delivery`.
            mode:
              type: string
              enum:
              - drayage
              - intermodal
              example: drayage
              description: Transportation mode for the order.
            railroads:
              type: string
              enum:
              - BNSF
              - CPKC
              example: BNSF
              description: Railroad handling the intermodal movement.
            train:
              type: string
              description: Name or identifier of the train carrying the freight.
            order_received_date:
              type: string
              format: date-time
              example: 2023-07-12 04:17:47.947000+00:00
              description: When the order was received.
            created_at:
              type: string
              format: date-time
              example: 2023-07-12 04:17:47.947000+00:00
              description: When the order record was created.
            equipments:
              type: array
              description: Equipment associated with the order.
              items:
                type: object
                properties:
                  equipment_id:
                    type: string
                    example: AAAU1231234
                    description: Identifier of the equipment, e.g. the container or trailer number.
                  equipment_type:
                    type: string
                    example: container
                    description: Type of equipment, e.g. `container` or `chassis`.
                  type:
                    type: string
                    example: ISO High Cube
                    description: Specific equipment type/classification.
                  size:
                    type: string
                    example: 40 ft
                    description: Size of the equipment.
                  status:
                    type: string
                    example: N/A
                    description: Current status of the equipment.
            arriving:
              type: object
              description: Location where the freight arrives.
              properties:
                name:
                  type: string
                  example: APMT
                  description: Name of the arrival location.
                address:
                  type: string
                  example: 2500 Navy Way San Pedro CA 90731 USA
                  description: Full address of the arrival location.
            delivering:
              type: object
              description: Final delivery location for the freight.
              properties:
                name:
                  type: string
                  example: Cargomatic Inc.
                  description: Name of the delivery location.
                address:
                  type: string
                  example: 211 E Ocean Blvd Long Beach CA 90802
                  description: Full address of the delivery location.
            hazmat_class:
              type: string
              example: N/A
              description: Hazardous-material class of the freight, or `N/A` if not hazmat.
            hazmat_packaging_group:
              type: string
              example: N/A
              description: Hazardous-material packaging group, or `N/A` if not hazmat.
    AddStopResponse:
      type: object
      properties:
        success:
          type: boolean
        shipment:
          type: object
          properties:
            market:
              type: object
              properties:
                name:
                  type: string
                  example: San Antonio
                code:
                  type: string
                  example: SAT
            _id:
              type: string
            shipment_id:
              type: string
              example: ABC-123
            stops:
              type: array
              items:
                type: object
                properties:
                  _id:
                    type: string
                    example: stopID123
                  action:
                    type: string
                    example: deliver
                  full_truckload:
                    type: boolean
                    example: false
                  location:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 1234567890z9310
                        address:
                          type: string
                          example: 211 E. Ocean Blvd, Suite 350, Long Beach, CA 90802, USA
                        street:
                          type: string
                          example: 211 E. Ocean Blvd
                        suite_or_apt:
                          type: string
                          example: Suite 350
                        zipcode:
                          type: string
                          example: '90802'
                        city:
                          type: string
                          example: Long Beach
                        state:
                          type: string
                          example: CA
                        lng:
                          type: number
                          example: -123.456789
                        lat:
                          type: number
                          example: 37.1234567
                  status:
                    type: string
                    example: unstarted
                  shipment_type:
                    type: string
                    example: shorthaul
                  sequence:
                    type: number
                    example: 2
                  window_start:
                    type: string
                    example: 2023-07-24 23:30:00+00:00
                  window_end:
                    type: string
                    example: 2023-07-24 23:30:00+00:00
    QuoteRequest:
      type: object
      description: Either `full_truckload` must be `true`, or `loads` must be provided. When `full_truckload` is `false`, `loads` is required.
      required:
      - full_truckload
      - stops
      - weight
      - shipment_type
      properties:
        accessorials:
          type: array
          description: Optional accessorial services requested for the shipment.
          items:
            type: object
            properties:
              type:
                type: string
                example: residential_delivery
                description: Allowed values for type are `cfs`, `hazmat`, `liftgate_origin`, `liftgate_destination`, `residential_delivery`, `room_of_choice`, `white_glove`, `airport_pickup`, `tsa_certification`, `flatbed_truck`, `two_man` and `inside_delivery`.
        courier:
          type: boolean
          description: Whether the quote is for a courier (small parcel) shipment.
        distance:
          type: integer
          format: int32
          example: 12583
          description: Distance of the shipment, in `distance_units` (default miles). If omitted, it is calculated from the stops.
        loads:
          type: array
          description: The loads being shipped. Required when `full_truckload` is `false`.
          items:
            type: object
            $ref: '#/components/schemas/QuoteRequestLoads'
        market:
          type: string
          example: SFO
          description: The valid values for `market` are the three letter identifiers for the market, like LAX, SFO, ATL, etc.
        stops:
          type: array
          description: Ordered list of pickup and delivery stops for the shipment.
          items:
            $ref: '#/components/schemas/QuoteRequestStops'
        weight:
          description: Total weight of the shipment, in `weight_units`.
          type: integer
          format: int32
          example: 40000
        weight_units:
          description: Unit of measure for `weight`. Default unit is `lb`.
          type: string
          example: lb
        shipper:
          type: object
          description: The shipper the quote is created on behalf of.
          properties:
            _id:
              type: string
              example: 62879ea006bfa2d915861ba6
              description: Shipper ID.
        full_truckload:
          type: boolean
          example: true
          description: Whether the shipment occupies a full truckload. If `false`, `loads` is required.
        shipment_type:
          type: string
          example: shorthaul
          description: Type of shipment, e.g. `shorthaul` or `drayage`.
    QuoteResponse:
      type: object
      properties:
        success:
          type: boolean
        quote:
          type: object
          properties:
            full_truckload:
              type: boolean
            shipment_type:
              type: string
              example: shorthaul
            weight:
              type: integer
              format: int32
              example: 4000
            distance:
              type: integer
              format: int32
              example: 4276
            courier:
              type: boolean
            created_at:
              type: string
              format: date-time
              example: 2023-07-12 03:41:08.784000+00:00
            total_cost:
              type: string
              example: 190.85
            origin:
              type: object
              properties:
                address:
                  type: string
                  example: 1550 Cota Ave Long Beach CA 90813 USA
                coords:
                  type: array
                  items:
                    type: number
                    example: -118.2162816
                name:
                  type: string
                  example: Atlas Marine
            destination:
              type: object
              properties:
                address:
                  type: string
                  example: 211 E Ocean Blvd Long Beach CA 90802
                coords:
                  type: array
                  items:
                    type: number
                    example: -118.19072819999997
                name:
                  type: string
                  example: Cargomatic
            loads:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: pallets
                  dimensional_units:
                    type: string
                    example: in
                  quantity:
                    type: integer
                    format: int32
                    example: 3
                  width:
                    type: integer
                    format: int32
                    example: 40
                  height:
                    type: integer
                    format: int32
                    example: 60
                  length:
                    type: integer
                    format: int32
                    example: 48
                  weight:
                    type: integer
                    format: int32
                    example: 4000
                  spaces:
                    type: integer
                    format: int32
                    example: 3
                  weight_units:
                    type: string
                    example: lb
                  _id:
                    type: string
                    example: 64ae20d4814c928bbafbeade
            quote_id:
              type: string
              example: BAD-QT-1796
            expiration_date:
              type: string
              format: date-time
              example: 2023-07-19 03:41:08+00:00
            receivables:
              type: array
              items:
                type: object
                properties:
                  message:
                    type: string
                    example: Residential
                  value:
                    type: integer
                    format: int32
                    example: 35
                  timestamp:
                    type: string
                    format: date-time
                    example: 2023-07-12 03:41:06.029000+00:00
            shipper:
              type: string
              example: badri.shipper@cargomatic.com
    CompleteStopRequest:
      type: object
      properties:
        stopId:
          type: string
          example: 5ca39c2a0cb793001366c012
        shipmentReference:
          type: string
          example: ABC-123
        meta:
          type: object
          description: Must contain at least one of `containerId`, `trailerId`, `chassis`, or `files`.
          properties:
            chassis:
              type: string
            containerId:
              type: string
            trailerId:
              type: string
            date:
              type: string
            files:
              type: array
              items:
                type: string
                example: stop_info.txt
      required:
      - stopId
      - shipmentReference
      - meta
    OrderRequestEquipments:
      type: object
      required:
      - equipment_id
      - _equipmentType
      properties:
        equipment_id:
          type: string
          example: AAAU1231234
          description: Identifier of the equipment, e.g. the container or trailer number.
        _equipmentType:
          type: string
          example: container
          description: Type of equipment, e.g. `container` or `chassis`.
    OrderRequestLocation:
      type: object
      required:
      - name
      - address
      properties:
        name:
          type: string
          example: APMT
          description: Name of the location. Can be an internal identifier, name of the location (ex. LAX Terminal 7), etc.
        address:
          type: string
          example: 2500 Navy Way San Pedro CA 90731
          description: US-based addresses must include street address, suite (if applicable), state, and zip code.
    ArriveAtStopResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            shipmentReference:
              type: string
            status:
              type: string
              example: arrived
            stopId:
              type: string
            meta:
              type: object
              properties:
                date:
                  type: string
    OrderRequest:
      type: object
      required:
      - arriving
      - delivering
      - master_bill_of_lading
      - movement_type
      - order_type
      - originating
      - reference_numbers
      - service_type
      - shipper
      properties:
        arriving:
          allOf:
          - $ref: '#/components/schemas/OrderRequestLocation'
          description: Location where the freight arrives (e.g. the port or rail terminal).
        contacts:
          type: array
          description: Contacts associated with the order.
          items:
            type: object
            properties:
              name:
                type: string
                example: Dispatch
                description: Contact name.
              phone:
                type: string
                example: 555-555-5555
                description: Contact phone number.
        delivering:
          allOf:
          - $ref: '#/components/schemas/OrderRequestLocation'
          description: Final delivery location for the freight.
        equipments:
          type: array
          description: Equipment (containers, chassis, etc.) associated with the order.
          items:
            $ref: '#/components/schemas/OrderRequestEquipments'
        estimated_arrival:
          type: string
          example: 2022-09-08Z00:00.00Z
          description: Estimated arrival date/time of the freight.
        master_bill_of_lading:
          type: string
          example: ABCU12345678
          description: Master Bill of Lading (MBL) number for the order.
        mode:
          type: string
          enum:
          - drayage
          - intermodal
          example: drayage
          description: Transportation mode for the order.
        movement_type:
          type: string
          enum:
          - pickup
          - delivery
          example: delivery
          description: Movement type of the order. One of `pickup` or `delivery`.
        ocean_carrier_scac:
          type: string
          example: MAEU
          description: The SCAC code for an Ocean Carrier. If the SCAC code is not a known Ocean Carrier SCAC, enter `Custom`.
        custom_ocean_carrier_scac:
          type: string
          example: AAAAAA
          description: This `custom_ocean_carrier_scac` is required when the value for `ocean_carrier_scac` is `Custom`.
        order_type:
          type: string
          example: import
          description: Valid entries for `order_type` are 'import', 'export', 'domestic', 'reposition'.
        originating:
          type: object
          description: Origin location of the freight, e.g. the foreign port of lading.
          properties:
            name:
              type: string
              example: Port of Tianjin
              description: Name of the origin location.
            address:
              type: string
              example: XPMV+74M Binhai Tianjin China 300456
              description: Full address of the origin location.
        reference_numbers:
          type: array
          items:
            type: object
            required:
            - name
            - value
            description: '`name` is the identifier for the reference number that you use. `value` is the reference number. Examples are ''receipt'' and ''invoice''. For example, if you want to use ''Invoice #002'' as a reference, the name would be `invoice` and the `value` would be `002`.'
            properties:
              name:
                type: string
                example: delivery_order
              value:
                type: string
                example: LGB0123456789
        service_type:
          type: string
          enum:
          - live
          - drop
          example: live
          description: How the freight is handled. One of `live` or `drop`.
        shipper:
