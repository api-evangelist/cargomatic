openapi: 3.0.0

info:
  title: 'Cargomatic Public API'
  description: >-
    ![Cargomatic](https://cargomaticprod.wpenginepowered.com/wp-content/uploads/2025/07/2020-Cargomatic-Logo-2.png)


    ## Welcome to the Cargomatic API!

    Our quoting, booking, and status APIs allow you to automate common workflows similar to features available within the Cargomatic portal.


    Please reach out to [apisupport@cargomatic.com](apisupport@cargomatic.com) for sandbox credentials to get started.
  version: 3.0.0

x-amazon-apigateway-cors:
  allowOrigins:
    - "*"
  allowCredentials: true
  exposeHeaders:
    - "x-apigateway-header"
    - "x-amz-date"
    - "content-type"
  maxAge: 3600
  allowMethods:
    - "*"
  allowHeaders":
    - "x-apigateway-header"
    - "x-amz-date"
    - "content-type"
    - "Authorization"

servers:
  - url: https://api-acceptance.cargomatic.com

tags:
  - name: Authorization
    description: Endpoints dealing with authenticating to the API
  - name: Shipper
    description: Endpoints for Cargomatic Shippers
  - name: Carrier
    description: Endpoints for Cargomatic Carriers and Drivers
  - name: Stops
    description: Endpoints for managing shipment stops
  - name: Document
    description: Endpoints for creating and retrieving documents attached to an entity

paths:
  /auth:
    post:
      operationId: auth
      summary: Retrieves an access token.
      description: >-
        This route returns an access `token` which is to be used for all subsequent requests in the Authorization header.
      tags:
        - Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequestBody'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /quotes:
    post:
      operationId: createQuote
      summary: Creates a quote
      description: >-
        Creates a quote based on the factors provided in the request body.

        This API endpoint is only accessible by Shippers and Admins!
      tags:
        - Shipper
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /orders:
    post:
      operationId: createOrder
      summary: Creates an order
      description: >-
        Creates an order based on the factors provided in the request body. This API endpoint can only be accessed by Shippers!
      tags:
        - Shipper
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /shipments:
    post:
      operationId: createShipment
      summary: Create a shipment/offer
      description: >-
        Creates a shipment based on the factors provided in the request body. This API endpoint can only be accessed by Admins and Shippers!

        `action` - add, update, cancel

      tags:
        - Shipper
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

    get:
      operationId: listShipments
      summary: Lists all shipments with a pagination option
      description: >-
        Returns a paginated list of shipments visible to the authenticated account. Use the `page` and `per_page` query parameters to page through results.
      tags:
        - Shipper
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number, indicates the page of results that you want returned. Default value is 1.
          required: false
          schema:
            type: number
        - name: per_page
          in: query
          description: Number of results to return per page.
          required: false
          schema:
            type: number
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /shipments/status:
    get:
      operationId: shipmentStatus
      summary: Returns a shipment with status info
      description: >-
        Returns the shipment identified by the `shipmentReference` query parameter, including its current status and the status of each of its stops.
      tags:
        - Shipper
      security:
        - bearerAuth: []
      parameters:
        - name: shipmentReference
          in: query
          description: Shipment Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /webhooks/loads:
    post:
      operationId: processLoads
      summary: Process loads
      description: >-
        Webhook endpoint that accepts an inbound load payload for processing. Returns `204 No Content` once the load has been accepted.
      tags:
        - Shipper
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json: { }
      responses:
        '204':
          description: 'Status Code 204: No Content - the request was accepted and there is no response body'

  /shipments/appointment:
    post:
      operationId: updateAppointment
      summary: Updates an existing appointment with a new status, start time, and/or end time. Requires the client to send at least one of new `windowStart` time, new `windowEnd` time, or `appointmentConfirmed`.
      tags:
        - Carrier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShipmentRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateShipmentResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /shipments/accept:
    post:
      operationId: acceptShipment
      summary: Accepts a Shipment
      description: >-
        Accepts an offered shipment on behalf of the authenticated carrier. The `shipmentReference` of the shipment to accept is required.
      tags:
        - Carrier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptShipmentRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptShipmentResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /carrier/{carrierId}/driver:
    post:
      operationId: createDriver
      summary: Creates a new Driver
      description: >-
        Creates a new driver under the carrier identified by the `carrierId` path parameter.
      tags:
        - Carrier
      security:
        - bearerAuth: []
      parameters:
        - name: carrierId
          in: path
          description: Id of the carrier
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDriverResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /shipment/assign:
    put:
      operationId: assignDriver
      summary: Assigns a driver to a shipment
      description: >-
        Assigns a driver to an accepted offer. Both the `offer_id` and the `driver_id` are required.
      tags:
        - Carrier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDriverRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignDriverResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /stops/complete:
    post:
      operationId: completeStop
      summary: Mark a stop as complete
      description: >-
        Marks a stop as "complete". The `stopId`, and `shipmentReference` is required for all shipment types. If the shipment is shorthaul, only admins can access this route and file data must also be provided. If the shipment is drayage, `chassis`, `trailerId`, and `containerId` may be required.
      tags:
        - Stops
        - Shipper
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteStopRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteStopResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /stops/transition:
    post:
      operationId: arriveAtStop
      summary: Mark a stop as "arrived"
      description: >-
        Marks a stop as "arrived". `status`, `stopId`, and `shipmentReference` are required. The only acceptable value for `status` is `arrived` (see example request body). If `date` is not provided, the current time will be used as the arrival time.

        Admins, shippers, carriers, and drivers are authorized to use this API endpoint.
      tags:
        - Stops
        - Shipper
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArriveAtStopRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArriveAtStopResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /stops/add:
    post:
      operationId: addStop
      summary: Add additional stops to a shipment
      description: >-
        `shipmentReference` and at least one new stop are required. Each new stop must include `address`, `action`, `name`, `sequence`, `windowStart`, `windowEnd`, and other fields dependent on the type of shipment.

        For US-based clients, the address must include street address, city, state, and zipcode. The `action` is either "pickup" or "delivery". The sequence number is sequence of the stop within the shipment. The `name` of the stop is the location name. `windowStart` is when the pickup/delivery window starts for that stop. `windowEnd` is when the pickup/delivery window ends for that stop.

        If the shipment is shorthaul, the new stop must include load data and it must be indicated whether the cargo is a full truckload or not. If the shipment is drayage, the new stop must indicate whether the container is empty or not and location must be included.
      tags:
        - Stops
        - Shipper
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddStopRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddStopResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /create-documents:
    post:
      operationId: createDocuments
      summary: Uploads documents
      description: >-
        Use this endpoint to create one or more document records within our system. Use the presigned URLs returned in the response to upload the actual files to our secure S3 buckets.
      tags:
        - Document
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
  
  /get-documents:
    post:
      operationId: getDocuments
      summary: Retrieves documents for a specified entity
      description: >-
        Use this endpoint to retrieve document links and metadata attached to a specific entity.
      tags:
        - Document
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDocumentRequest'
      responses:
        '200':
          description: 'Status Code 200: Successful Response - the request was successful!'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentResponse'
        '400':
          description: 'Status Code 400: Bad Request Response - the request header and/or body is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: "Status Code 500: Internal Server Error Response - there's a problem with the Public API service"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequestBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      example:
        username: 'Username'
        password: 'MyPassword'
      required:
        - username
        - password

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
      example:
        success: true
        token: '{token-value}'

    BadRequestResponse:
      type: object
      properties:
        message:
          type: string
      example:
        message: 'Invalid Request Body'

    InternalServerErrorResponse:
      type: object
      properties:
        message:
          type: string
      example:
        message: 'Internal Server Error'

    QuoteRequestLoads:
      type: object
      description: >-
        If `full_truckload` is `false`, `loads` data are required: `loads` must contain at least one entry and the required data for each entry is `type`, `quantity`, `length`, `width`, `height`, and `weight`.
      required:
        - type
        - quantity
        - length
        - width
        - height
        - weight
      properties:
        type:
          type: string
          example: pallets
          description: Packaging type for the load, e.g. `pallets`, `boxes`, or `crates`.
        quantity:
          type: integer
          format: int32
          example: 1
          description: Number of units of this load.
        length:
          type: integer
          format: int32
          example: 48
          description: Length of each unit, expressed in `dimensional_units`.
        width:
          type: integer
          format: int32
          example: 40
          description: Width of each unit, expressed in `dimensional_units`.
        height:
          type: integer
          format: int32
          example: 60
          description: Height of each unit, expressed in `dimensional_units`.
        weight:
          type: integer
          format: int32
          example: 0
          description: Weight of the load, expressed in `weight_units`.
        weight_units:
          type: string
          example: lb
          description: Unit of measure for `weight`. Default value is `lb`.
        dimensional_units:
          type: string
          example: in
          description: Unit of measure for `length`, `width`, and `height`. Default value is `in`.
        languageCodeId:
          type: string
          example: en-us
          description: Locale code for the load, e.g. `en-us`.
        distance_units:
          type: string
          example: mi
          description: Unit of measure for distance. Default value is `mi`.
        currency:
          type: string
          example: USD
          description: ISO currency code for monetary values. Default value is `USD`.
        temperature_units:
          type: string
          example: F
          description: Unit of measure for temperature-controlled loads, e.g. `F` or `C`.
        stackable:
          type: boolean
          example: false
          description: Whether the load can be stacked. Default value is `false`.

    QuoteRequestStops:
      type: object
      required:
        - action
        - location
      properties:
        action:
          type: string
          example: pickup
          description: Acceptable values for `action` are `pickup` and  `deliver`.
        location:
          type: object
          description: Where this stop takes place.
          required:
            - name
            - address
          properties:
            name:
              type: string
              example: Atlas Marine
              description: Name of the location.
            address:
              type: string
              example: 1550 Cota Ave Long Beach CA 90813
              description: Full address of the location. US-based addresses must include street, city, state, and zip code.

    QuoteRequestPallets:
      type: object
      required:
        - type
        - quantity
        - length
        - width
        - height
        - languageCodeId
        - currency
      properties:
        type:
          type: string
          example: pallets
        quantity:
          type: integer
          format: int32
          example: 1
        length:
          type: integer
          format: int32
          example: 48
        width:
          type: integer
          format: int32
          example: 40
        height:
          type: integer
          format: int32
          example: 60
        weight:
          type: integer
          format: int32
          example: 0
        weight_units:
          type: string
          example: lb
          description: Default value is `lb`.
        dimensional_units:
          type: string
          example: in
          description: Default value is `in`.
        languageCodeId:
          type: string
          example: en-us
        distance_units:
          type: string
          example: mi
        currency:
          type: string
          example: USD
        temperature_units:
          type: string
          example: F
        stackable:
          type: boolean
          example: false
          description: Default value is `false`.

    QuoteRequest:
      type: object
      description: >-
        Either `full_truckload` must be `true`, or `loads` must be provided. When `full_truckload` is `false`, `loads` is required.
      required:
        - full_truckload
        - stops
        - weight
        - shipment_type
      properties:
        accessorials:
          type: array
          description: Optional accessorial services requested for the shipment.
          items:
            type: object
            properties:
              type:
                type: string
                example: residential_delivery
                description:  >-
                  Allowed values for type are `cfs`, `hazmat`, `liftgate_origin`, `liftgate_destination`, `residential_delivery`, `room_of_choice`, `white_glove`, `airport_pickup`, `tsa_certification`, `flatbed_truck`, `two_man` and `inside_delivery`.
        courier:
          type: boolean
          description: Whether the quote is for a courier (small parcel) shipment.
        distance:
          type: integer
          format: int32
          example: 12583
          description: Distance of the shipment, in `distance_units` (default miles). If omitted, it is calculated from the stops.
        loads:
          type: array
          description: The loads being shipped. Required when `full_truckload` is `false`.
          items:
            type: object
            $ref: '#/components/schemas/QuoteRequestLoads'
        market:
          type: string
          example: SFO
          description: The valid values for `market` are the three letter identifiers for the market, like LAX, SFO, ATL, etc.
        stops:
          type: array
          description: Ordered list of pickup and delivery stops for the shipment.
          items:
            $ref: '#/components/schemas/QuoteRequestStops'
        weight:
          description: Total weight of the shipment, in `weight_units`.
          type: integer
          format: int32
          example: 40000
        weight_units:
          description: Unit of measure for `weight`. Default unit is `lb`.
          type: string
          example: lb
        shipper:
          type: object
          description: The shipper the quote is created on behalf of.
          properties:
            _id:
              type: string
              example: 62879ea006bfa2d915861ba6
              description: Shipper ID.
        full_truckload:
          type: boolean
          example: true
          description: Whether the shipment occupies a full truckload. If `false`, `loads` is required.
        shipment_type:
          type: string
          example: shorthaul
