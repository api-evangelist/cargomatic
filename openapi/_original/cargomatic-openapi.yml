                          example: pallets
                        quantity:
                          type: integer
                          format: int32
                          example: 5
                        width:
                          type: integer
                          format: int32
                          example: 40
                        height:
                          type: integer
                          format: int32
                          example: 48
                        length:
                          type: integer
                          format: int32
                          example: 40
                        weight:
                          type: integer
                          format: int32
                          example: 2500
                  contacts:
                    type: array
                    description: Contacts for this stop.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: support
                          description: Contact name.
                        email:
                          type: string
                          example: support@cargomatic.com
                          description: Contact email address.
                        phone:
                          type: string
                          example: 555-555-5555
                          description: Contact phone number.
                  action:
                    type: string
                    example: pickup
                    description: Action performed at this stop, either `pickup` or `delivery`.
                  window_start:
                    type: string
                    format: date-time
                    example: 2022-03-31T18:00:00.000Z
                    description: Start of the pickup/delivery window for this stop.
                  window_end:
                    type: string
                    format: date-time
                    example: 2022-03-31T21:00:00.000Z
                    description: End of the pickup/delivery window for this stop.
                  reference_numbers:
                    type: array
                    description: Reference numbers specific to this stop.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: My Stop Reference Number
                          description: Identifier for the reference number.
                        value:
                          type: string
                          example: cargomatic123456
                          description: Value of the reference number.
            loads:
              type: array
              description: Shipment-level loads, used when loads are not broken out per stop.
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: pallets
                  quantity:
                    type: integer
                    format: int32
                    example: 5
                  width:
                    type: integer
                    format: int32
                    example: 40
                  height:
                    type: integer
                    format: int32
                    example: 48
                  length:
                    type: integer
                    format: int32
                    example: 40
                  weight:
                    type: integer
                    format: int32
                    example: 2500
            accessorials:
