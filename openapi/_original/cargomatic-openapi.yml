                        type: string
                        example: 211 E. Ocean Blvd Long Beach CA 90802
                        description: Street address of the location.
                      suite_or_apt:
                        type: string
                        example: Suite 350
                        description: Suite or apartment number, if applicable.
                  loads:
                    type: array
                    description: Loads picked up or delivered at this stop. Each entry describes a unit's type, quantity, dimensions, and weight.
                    items:
                      type: object
                      properties:
                        type:
