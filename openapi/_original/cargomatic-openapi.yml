              items:
                type: object
                properties:
                  type:
                    type: string
                    example: pallet_jack
                    description: Type of accessorial service.
            weight:
              type: integer
              format: int32
              example: 2500
              description: Total weight of the shipment, in pounds.
            notes:
              type: string
              example: These are my notes!
              description: Free-text notes about the shipment.

