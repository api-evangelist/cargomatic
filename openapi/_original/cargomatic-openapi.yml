            shipment_type:
              type: string
              example: shorthaul
              description: Type of shipment, e.g. `shorthaul` or `drayage`.
            shipper:
              type: string
              example: 62879ea006bfa2d915861ba6
              description: ID of the shipper the offer is created for.

            stops:
              type: array
              description: Ordered list of pickup and delivery stops for the shipment.
              items:
                type: object
                required:
                  - sequence
                  - location
                  - action
                  - window_start
                  - window_end
