            $ref: '#/components/schemas/OrderRequestShipmentsStagingStops'

    OrderRequest:
      type: object
      required:
        - arriving
        - delivering
        - master_bill_of_lading
        - movement_type
        - order_type
        - originating
        - reference_numbers
        - service_type
        - shipper
      properties:
        arriving:
          allOf:
            - $ref: '#/components/schemas/OrderRequestLocation'
          description: Location where the freight arrives (e.g. the port or rail terminal).
        contacts:
          type: array
          description: Contacts associated with the order.
          items:
            type: object
            properties:
              name:
                type: string
                example: Dispatch
                description: Contact name.
              phone:
                type: string
                example: 555-555-5555
                description: Contact phone number.
        delivering:
          allOf:
            - $ref: '#/components/schemas/OrderRequestLocation'
          description: Final delivery location for the freight.
        equipments:
          type: array
          description: Equipment (containers, chassis, etc.) associated with the order.
          items:
            $ref: '#/components/schemas/OrderRequestEquipments'
        estimated_arrival:
          type: string
          example: 2022-09-08Z00:00.00Z
          description: Estimated arrival date/time of the freight.
        master_bill_of_lading:
          type: string
          example: ABCU12345678
          description: Master Bill of Lading (MBL) number for the order.
        mode:
          type: string
          enum:
            - drayage
            - intermodal
          example: drayage
          description: Transportation mode for the order.
        movement_type:
          type: string
          enum:
            - pickup
            - delivery
          example: delivery
          description: Movement type of the order. One of `pickup` or `delivery`.
        ocean_carrier_scac:
          type: string
          example: MAEU
          description: The SCAC code for an Ocean Carrier. If the SCAC code is not a known Ocean Carrier SCAC, enter `Custom`.
        custom_ocean_carrier_scac:
          type: string
          example: AAAAAA
          description: This `custom_ocean_carrier_scac` is required when the value for `ocean_carrier_scac` is `Custom`.
        order_type:
          type: string
          example: import
          description: Valid entries for `order_type` are 'import', 'export', 'domestic', 'reposition'.
        originating:
          type: object
          description: Origin location of the freight, e.g. the foreign port of lading.
          properties:
            name:
              type: string
              example: Port of Tianjin
              description: Name of the origin location.
            address:
              type: string
              example: XPMV+74M Binhai Tianjin China 300456
              description: Full address of the origin location.
        reference_numbers:
          type: array
          items:
            type: object
            required:
              - name
              - value
            description: "`name` is the identifier for the reference number that you use. `value` is the reference number. Examples are 'receipt' and 'invoice'. For example, if you want to use 'Invoice #002' as a reference, the name would be `invoice` and the `value` would be `002`."
            properties:
              name:
                type: string
                example: delivery_order
              value:
                type: string
                example: LGB0123456789
        service_type:
          type: string
          enum:
            - live
            - drop
          example: live
          description: How the freight is handled. One of `live` or `drop`.
        shipper:
          type: string
          example: 63108dce37cc4180163047d9
          description: '`shipper` is the shipper ID.'
        shipments_staging:
          type: array
          description: Shipments staged from this order, each with its own stops and weight.
          items:
            $ref: '#/components/schemas/OrderRequestShipmentsStaging'
        special_instructions:
          type: string
          example: Please deliver this freight!
          description: Free-text instructions for handling the order.
        railroads:
          type: string
          enum:
            - BNSF
            - CPKC
          example: BNSF
          description: Railroad handling the intermodal movement.
        steamship_or_railroad:
          type: string
          example: BNSF
          description: If there is no ocean carrier associated with this shipment, `steamship_or_railroad` is required.
        total_weight:
          type: integer
          format: int32
          example: 35000
          description: Total weight of the order, in pounds.
        train:
          type: string
          description: Name or identifier of the train carrying the freight.
        vessel_or_rail:
          type: string
          example: ELEONORA
          description: Name of the vessel or rail carrying the freight.

