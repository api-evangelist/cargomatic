aid: cargomatic
name: Cargomatic
description: >-
  Cargomatic is a technology-enabled marketplace for local freight and drayage that connects shippers
  with a network of more than 35,000 professional truck drivers across the top 20 ports in the continental
  United States. Its platform automates quoting, booking, dispatch, tracking, and document exchange for
  drayage, intermodal, less-than-truckload (LTL), full-truckload (FTL), and white-glove final-mile
  delivery. Cargomatic exposes a public REST API (the Cargomatic Public API) so shippers and carriers can
  automate the same quoting, order-creation, shipment-status, stop-management, driver-assignment, and
  document workflows available in the Cargomatic portal, authenticating with JWT bearer tokens issued from
  an authentication endpoint. The company is headquartered in Long Beach, California and is backed by
  Canaan Partners and the SoftBank Vision Fund.
